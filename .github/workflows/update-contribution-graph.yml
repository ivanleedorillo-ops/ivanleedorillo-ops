name: Update contribution graph

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-contribution-graph.yml"
      - "scripts/generate-contribution-graph.mjs"

permissions:
  contents: write

concurrency:
  group: profile-contribution-graph
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ivanleedorillo-ops
        run: node scripts/generate-contribution-graph.mjs

      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/contribution-graph.svg; then
            echo "Contribution graph is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/contribution-graph.svg
            git commit -m "chore: refresh contribution graph"
            git push
          fi
